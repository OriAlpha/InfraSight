name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Build client
        run: |
          cd client
          npm run build

  backend:
    name: Test Backend
    runs-on: ubuntu-latest

    # PostgreSQL mode was unstartable and CI had no way to notice. The adapter
    # parity tests run against this instance.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: infrasight
          POSTGRES_PASSWORD: infrasight
          POSTGRES_DB: infrasight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infrasight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      # Parses every file under server/ — no hand-maintained list to fall behind.
      - name: Verify syntax
        run: node scripts/check-syntax.js

      - name: Run unit tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://infrasight:infrasight@localhost:5432/infrasight_test
        run: |
          cd server
          npm run test:coverage

      # Proves the server actually boots against PostgreSQL, which is how the
      # seedModels() breakage would have been caught.
      - name: Smoke test PostgreSQL startup
        env:
          DATABASE_URL: postgresql://infrasight:infrasight@localhost:5432/infrasight_test
          PORT: '3123'
          MOCK_MODE: 'true'
        run: |
          cd server
          node index.js > /tmp/pg-boot.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:3123/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Server is up."
              cat /tmp/health.json
              grep -q '"database":"PostgreSQL"' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start against PostgreSQL:"
          cat /tmp/pg-boot.log
          exit 1

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t infrasight:ci .

      - name: Verify the container starts and reports healthy
        run: |
          docker run -d --name infrasight-ci -p 3000:3000 -e MOCK_MODE=true infrasight:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Container is serving."
              docker exec infrasight-ci id
              docker rm -f infrasight-ci
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy:"
          docker logs infrasight-ci
          exit 1

  python-tests:
    name: Verify Python Demos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify syntax of tests
        run: |
          python -m py_compile tests/*.py
